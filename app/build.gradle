plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.example.pp'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.pp"
        minSdk 36
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            def props = new Properties()
            def propFile = project.rootProject.file('local.properties')
            if (propFile.exists()) {
                props.load(propFile.newDataInputStream())
            }
            def backupKey = props.getProperty('PP_BACKUP_KEY', 'DefaultFallbackDevelopmentKeyString')
            def googleClientId = props.getProperty('GOOGLE_WEB_CLIENT_ID', '')
            def backupPath = props.getProperty('BACKUP_PATH', 'backups')
            def quotesApiKey = props.getProperty('QUOTES_API_KEY', '')
            
            buildConfigField "String", "BACKUP_SECRET_KEY", "\"${backupKey}\""
            buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${googleClientId}\""
            buildConfigField "String", "BACKUP_PATH", "\"${backupPath}\""
            buildConfigField "String", "QUOTES_API_KEY", "\"${quotesApiKey}\""
        }
        debug {
            def props = new Properties()
            def propFile = project.rootProject.file('local.properties')
            if (propFile.exists()) {
                props.load(propFile.newDataInputStream())
            }
            def backupKey = props.getProperty('PP_BACKUP_KEY', 'DefaultFallbackDevelopmentKeyString')
            def googleClientId = props.getProperty('GOOGLE_WEB_CLIENT_ID', '')
            def backupPath = props.getProperty('BACKUP_PATH', 'backups')
            def quotesApiKey = props.getProperty('QUOTES_API_KEY', '')
            
            buildConfigField "String", "BACKUP_SECRET_KEY", "\"${backupKey}\""
            buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${googleClientId}\""
            buildConfigField "String", "BACKUP_PATH", "\"${backupPath}\""
            buildConfigField "String", "QUOTES_API_KEY", "\"${quotesApiKey}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += '/META-INF/DEPENDENCIES'
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.google.auth
    implementation libs.google.drive
    implementation libs.google.api.client
    implementation libs.google.http.gson
    implementation libs.google.http.android
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.cardview
    implementation libs.material.calendarview
    implementation libs.room.runtime
    implementation libs.work.runtime
    implementation libs.gson
    implementation libs.threetenabp
    annotationProcessor libs.room.compiler
    compileOnly libs.lombok
    annotationProcessor libs.lombok
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.mpandroidchart
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging
    implementation libs.flexbox

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}